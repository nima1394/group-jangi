<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروه جنگی 🔥</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .app-container { background: #1e293b; width: 100%; max-width: 480px; border-radius: 12px; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; height: 95vh; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
        .header { padding: 12px; background: #0f172a; border-bottom: 1px solid #334155; }
        .user-info { font-size: 12px; color: #38bdf8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .group-title { text-align: center; padding: 8px; background: #1e293b; border-radius: 8px; margin-bottom: 8px; border: 1px solid #facc15; }
        .group-title h2 { color: #facc15; font-size: 18px; }
        .group-title span { color: #94a3b8; font-size: 12px; }
        .top-btns { display: flex; gap: 6px; align-items: center; }
        .top-btn { background: #38bdf8; color: #0f172a; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .top-btn:hover { opacity: 0.9; }
        .private-btn { background: #8b5cf6; color: #fff; }
        .server-btn { background: #ef4444; color: #fff; }
        .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0b1120; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .msg.sent { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-left-radius: 0; }
        .msg.received { align-self: flex-start; background: #334155; color: #e2e8f0; border-bottom-right-radius: 0; }
        .msg.private-sent { align-self: flex-end; background: #8b5cf6; color: #fff; border-bottom-left-radius: 0; }
        .msg.private-received { align-self: flex-start; background: #6d28d9; color: #fff; border-bottom-right-radius: 0; }
        .msg-sender { font-size: 10px; color: #facc15; margin-bottom: 3px; font-weight: bold; }
        .msg-time { font-size: 9px; opacity: 0.7; margin-top: 4px; text-align: left; }
        .msg-system { align-self: center; background: #475569; color: #94a3b8; font-size: 11px; padding: 4px 12px; border-radius: 20px; max-width: 90%; text-align: center; }
        .msg-image img { max-width: 200px; max-height: 200px; border-radius: 8px; cursor: pointer; }
        .msg-audio audio { max-width: 200px; height: 35px; }
        .input-box { padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 13px; outline: none; min-width: 100px; }
        button { padding: 8px 12px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 12px; }
        button:hover { opacity: 0.9; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 8px; }
        .chat-mode-info { background: #8b5cf6; color: #fff; padding: 6px 12px; font-size: 11px; text-align: center; display: none; }
        .chat-mode-info.show { display: block; }
        .notif-badge { background: #ef4444; color: #fff; border-radius: 50%; padding: 1px 6px; font-size: 10px; margin-right: 5px; font-weight: bold; }
        .user-list { max-height: 200px; overflow-y: auto; margin: 10px 0; text-align: right; }
        .user-item { background: #0f172a; padding: 10px 15px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .user-item:hover { background: #334155; border-color: #8b5cf6; }
        .user-item.selected { background: #8b5cf6; border-color: #8b5cf6; }
        .user-item .name { color: #fff; font-weight: bold; }
        .online-dot { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-left: 5px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .stat-card { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card .num { font-size: 22px; font-weight: bold; }
        .stat-card .label { font-size: 10px; color: #94a3b8; margin-top: 3px; }
        .stat-card.blue .num { color: #38bdf8; }
        .stat-card.green .num { color: #22c55e; }
        .stat-card.yellow .num { color: #facc15; }
        .danger-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #ef4444; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .danger-btn:hover { background: #dc2626; }
        .danger-btn:disabled { opacity: 0.5; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; border: 1px solid #334155; }
        .user-row .name { color: #fff; font-weight: bold; font-size: 13px; }
        .user-row .del-btn { background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .success-msg { background: #052e16; border: 1px solid #22c55e; color: #86efac; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 12px; display: none; }
        .emoji-picker { display: none; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #475569; flex-wrap: wrap; gap: 5px; width: 100%; max-height: 150px; overflow-y: auto; }
        .emoji-picker.show { display: flex; }
        .emoji-picker span { font-size: 22px; cursor: pointer; padding: 4px; border-radius: 4px; }
        .emoji-picker span:hover { background: #334155; }
        .btn-emoji { background: #facc15; color: #0f172a; font-size: 16px; padding: 8px 10px; }
        .btn-media { background: #8b5cf6; color: #fff; font-size: 14px; padding: 8px 10px; }
        .btn-audio { background: #ef4444; color: #fff; font-size: 14px; padding: 8px 10px; }
        .btn-audio.recording { background: #dc2626; animation: pulse 1s infinite; }
        #imageInput { display: none; }
        .preview { display: none; position: relative; width: 100%; padding: 5px; }
        .preview.show { display: block; }
        .preview img { max-height: 80px; border-radius: 8px; }
        .preview .remove { position: absolute; top: 0; right: 0; background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <!-- مودال ورود -->
    <div id="loginModal" class="modal" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; color: #facc15;">🔥 ورود به گروه جنگی</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">لطفاً نام خود را وارد کنید:</p>
            <input type="text" id="modalUsername" placeholder="اسم شما..." maxlength="20">
            <button onclick="registerUser()" style="width: 100%; margin-top: 10px; background: #facc15; color: #0f172a;">ورود به گروه 🚀</button>
            <div id="loginError" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <!-- مودال چت خصوصی -->
    <div id="privateModal" class="modal" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; color: #8b5cf6;">💬 چت خصوصی</h3>
            <input type="text" id="privateUsername" placeholder="جستجوی کاربر..." oninput="filterUsers()" style="margin-bottom:10px;">
            <div class="user-list" id="userList"></div>
            <button onclick="startPrivateChatFromInput()" style="width: 100%; margin-top: 10px; background: #8b5cf6; color: #fff;">شروع چت 💜</button>
            <button onclick="closePrivateModal()" style="width: 100%; margin-top: 8px; background: #475569; color: #fff;">بستن</button>
            <div id="privateError" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <!-- مودال رمز سرور -->
    <div id="serverPassModal" class="modal" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; color: #ef4444;">🖥️ ورود به سرور</h3>
            <input type="password" id="serverPassword" placeholder="رمز عبور...">
            <button onclick="checkServerPassword()" style="width: 100%; margin-top: 10px; background: #ef4444; color: #fff;">ورود 🚀</button>
            <button onclick="closeServerPassModal()" style="width: 100%; margin-top: 8px; background: #475569; color: #fff;">بستن</button>
            <div id="serverPassError" class="error-msg" style="display:none;"></div>
            <div id="attemptsWarning" style="color:#f59e0b; font-size:11px; margin-top:8px; display:none;"></div>
        </div>
    </div>

    <!-- مودال پنل سرور -->
    <div id="serverPanelModal" class="modal" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 15px; color: #ef4444;">🖥️ مدیریت سرور</h3>
            <div class="stats-grid">
                <div class="stat-card blue"><div class="num" id="statUsers">0</div><div class="label">👤 کاربران</div></div>
                <div class="stat-card green"><div class="num" id="statMessages">0</div><div class="label">📨 پیام‌ها</div></div>
                <div class="stat-card yellow"><div class="num" id="statGroups">0</div><div class="label">📁 گروه‌ها</div></div>
            </div>
            <div style="text-align:right; margin-bottom:8px; color:#facc15; font-size:13px; font-weight:bold;">👥 لیست کاربران</div>
            <div id="serverUserList" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
            <button class="danger-btn" onclick="deleteAllData()" id="deleteAllBtn">🗑️ پاک کردن همه اطلاعات</button>
            <button onclick="closeServerPanel()" style="width: 100%; margin-top: 8px; background: #475569; color: #fff;">بستن</button>
            <div class="success-msg" id="serverSuccessMsg"></div>
            <div id="serverPanelError" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <!-- مودال نمایش تصویر -->
    <div id="imageModal" class="modal" style="display: none;" onclick="closeImageModal()">
        <img id="fullImage" style="max-width: 95%; max-height: 95%; border-radius: 8px;">
    </div>

    <div class="app-container">
        <div class="header">
            <div class="user-info">
                <span>👤 <b id="currentUserLabel">...</b><span class="online-dot"></span></span>
                <div class="top-btns">
                    <span id="notifBadge" class="notif-badge" style="display:none;">0</span>
                    <button class="top-btn private-btn" onclick="openPrivateModal()">💬</button>
                    <button class="top-btn server-btn" onclick="openServerPassModal()">🖥️</button>
                </div>
            </div>
            <div class="group-title">
                <h2>🔥 گروه جنگی</h2>
                <span id="headerSubtitle">💬 پیام‌ها در این گروه ذخیره می‌شوند</span>
            </div>
        </div>
        <div class="chat-mode-info" id="chatModeInfo">
            💬 چت خصوصی با: <b id="chatWithName"></b>
            <button onclick="backToGroup()" style="background:#fff;color:#8b5cf6;margin-right:10px;padding:2px 8px;font-size:11px;border:none;border-radius:4px;cursor:pointer;">بازگشت به گروه</button>
        </div>
        <div class="messages-box" id="messagesBox">
            <div class="msg-system">🔥 به گروه جنگی خوش آمدید!</div>
        </div>
        <div class="input-box">
            <button class="btn-emoji" onclick="toggleEmoji()">😊</button>
            <button class="btn-media" onclick="document.getElementById('imageInput').click()">🖼️</button>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <button class="btn-audio" id="audioBtn" onclick="toggleRecording()">🎤</button>
            <input type="text" id="msgInput" placeholder="پیام..." disabled>
            <button onclick="sendMessage()" id="sendBtn" disabled>ارسال</button>
            <div class="preview" id="previewBox">
                <img id="previewImg" src="">
                <button class="remove" onclick="removeImage()">✕</button>
            </div>
            <div class="emoji-picker" id="emojiPicker">
                <span onclick="addEmoji('😊')">😊</span>
                <span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('❤️')">❤️</span>
                <span onclick="addEmoji('🔥')">🔥</span>
                <span onclick="addEmoji('👍')">👍</span>
                <span onclick="addEmoji('👏')">👏</span>
                <span onclick="addEmoji('🎉')">🎉</span>
                <span onclick="addEmoji('💪')">💪</span>
                <span onclick="addEmoji('😍')">😍</span>
                <span onclick="addEmoji('🤣')">🤣</span>
                <span onclick="addEmoji('😎')">😎</span>
                <span onclick="addEmoji('🙏')">🙏</span>
                <span onclick="addEmoji('💯')">💯</span>
                <span onclick="addEmoji('✨')">✨</span>
                <span onclick="addEmoji('🤔')">🤔</span>
                <span onclick="addEmoji('😴')">😴</span>
                <span onclick="addEmoji('🥺')">🥺</span>
                <span onclick="addEmoji('😭')">😭</span>
                <span onclick="addEmoji('🥰')">🥰</span>
                <span onclick="addEmoji('😘')">😘</span>
                <span onclick="addEmoji('🤗')">🤗</span>
                <span onclick="addEmoji('🫡')">🫡</span>
                <span onclick="addEmoji('💀')">💀</span>
                <span onclick="addEmoji('👀')">👀</span>
                <span onclick="addEmoji('🤝')">🤝</span>
            </div>
        </div>
    </div>

    <script>
        // ============ امنیت: جلوی دستکاری کد رو می‌گیریم ============
        (function() {
            // غیرفعال کردن کنسول (اختیاری - برای امنیت بیشتر)
            // var _z = console;
            // Object.defineProperty(window, "console", {
            //     get: function() { return _z; },
            //     set: function() {}
            // });
            
            // تشخیص DevTools (اختیاری)
            let devtoolsOpen = false;
            const element = new Image();
            Object.defineProperty(element, 'id', {
                get: function() {
                    devtoolsOpen = true;
                }
            });
        })();

        const SUPABASE_URL = "https://jimvkiprcbpqruvhyfrm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_00YkZ5PxbALEn4O09XKgSw_KFQiSWE0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const GROUP_NAME = "گروه جنگی";
        
        // رمز هش شده (SHA-256) - اگه کسی ببینه، نمی‌تونه بفهمه چیه
        // رمز اصلی: nimaaslani1234A
        const ADMIN_HASH = "c5b58e0e6d7f5b4a2d7b8e9f1c3a4b5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b";
        
        let myUsername = localStorage.getItem('chat_username');
        let fetchInterval = null;
        let chatType = 'group';
        let chatTarget = '';
        let lastMsgIds = new Set();
        let allUsers = [];
        let selectedUser = '';
        let serverAuth = false;
        let wrongAttempts = parseInt(localStorage.getItem('server_wrong_attempts') || '0');
        let lockoutUntil = parseInt(localStorage.getItem('server_lockout_until') || '0');

        // ============ هش کردن رمز ============
        async function sha256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.onload = async () => {
            if (!myUsername) {
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                document.getElementById('currentUserLabel').innerText = myUsername;
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                await loadMessages();
                await loadAllUsers();
                startAutoRefresh();
            }
        };

        async function registerUser() {
            const nameInput = document.getElementById('modalUsername').value.trim();
            const errDiv = document.getElementById('loginError');
            errDiv.style.display = 'none';
            
            if (!nameInput) {
                errDiv.innerText = 'لطفاً نام را وارد کنید!';
                errDiv.style.display = 'block';
                return;
            }
            if (nameInput.length < 2) {
                errDiv.innerText = 'نام باید حداقل 2 کاراکتر باشه!';
                errDiv.style.display = 'block';
                return;
            }
            if (nameInput.length > 20) {
                errDiv.innerText = 'نام باید حداکثر 20 کاراکتر باشه!';
                errDiv.style.display = 'block';
                return;
            }
            if (!/^[آ-یa-zA-Z0-9_\s]+$/.test(nameInput)) {
                errDiv.innerText = 'فقط حروف، اعداد و _ مجاز است!';
                errDiv.style.display = 'block';
                return;
            }
            
            try {
                const { data: existing } = await supabaseClient
                    .from('users').select('id').eq('username', nameInput).limit(1);
                if (!existing || existing.length === 0) {
                    await supabaseClient.from('users').insert([{ username: nameInput }]);
                }
                localStorage.setItem('chat_username', nameInput);
                myUsername = nameInput;
                document.getElementById('currentUserLabel').innerText = myUsername;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                await sendWelcomeMessage();
                await loadMessages();
                await loadAllUsers();
                startAutoRefresh();
            } catch(e) { 
                errDiv.innerText = 'خطا: ' + e.message;
                errDiv.style.display = 'block';
            }
        }

        async function sendWelcomeMessage() {
            const welcomeText = '👋 ' + myUsername + ' به گروه پیوست!';
            const compressedText = LZString.compressToUTF16(welcomeText);
            await supabaseClient.from('messages').insert([{
                sender: 'system',
                receiver: 'GROUP:' + GROUP_NAME,
                content: compressedText
            }]);
        }

        async function loadAllUsers() {
            try {
                const { data } = await supabaseClient.from('users').select('username');
                if (data) {
                    allUsers = data.map(u => u.username).filter(u => u !== myUsername);
                }
            } catch(e) { console.error(e); }
        }

        // ============ ایموجی ============
        function toggleEmoji() {
            document.getElementById('emojiPicker').classList.toggle('show');
        }

        function addEmoji(emoji) {
            document.getElementById('msgInput').value += emoji;
            document.getElementById('msgInput').focus();
        }

        // ============ تصویر ============
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                alert('حجم تصویر باید کمتر از 2 مگابایت باشه!');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewBox').classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            document.getElementById('previewBox').classList.remove('show');
            document.getElementById('imageInput').value = '';
        }

        function openImageModal(src) {
            document.getElementById('fullImage').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // ============ ضبط صدا ============
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isRecording = true;
                document.getElementById('audioBtn').classList.add('recording');
                document.getElementById('audioBtn').innerText = '⏹️';
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = async () => {
                        const base64 = reader.result.split(',')[1];
                        await sendAudioMessage(base64);
                    };
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
            } catch(e) {
                alert('دسترسی به میکروفون ممکن نیست: ' + e.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('audioBtn').classList.remove('recording');
                document.getElementById('audioBtn').innerText = '🎤';
            }
        }

        async function sendAudioMessage(base64) {
            const content = 'AUDIO:' + base64;
            const compressed = LZString.compressToUTF16(content);
            let receiver = chatType === 'group' ? 'GROUP:' + GROUP_NAME : getPrivateReceiver();
            await supabaseClient.from('messages').insert([{
                sender: myUsername, receiver: receiver, content: compressed
            }]);
            await loadMessages();
        }

        // ============ چت خصوصی ============
        function openPrivateModal() {
            document.getElementById('privateModal').style.display = 'flex';
            document.getElementById('privateUsername').value = '';
            document.getElementById('privateError').style.display = 'none';
            selectedUser = '';
            renderUserList('');
        }

        function closePrivateModal() {
            document.getElementById('privateModal').style.display = 'none';
        }

        function renderUserList(filter) {
            const list = document.getElementById('userList');
            const filtered = allUsers.filter(u => u.toLowerCase().includes(filter.toLowerCase()));
            if (filtered.length === 0) {
                list.innerHTML = '<div style="color:#64748b;padding:10px;font-size:12px;text-align:center;">کاربری یافت نشد</div>';
                return;
            }
            list.innerHTML = filtered.map(u => `
                <div class="user-item ${selectedUser === u ? 'selected' : ''}" onclick="selectUser('${u}')">
                    <span class="name">👤 ${u}</span>
                    <span style="font-size:10px;color:#22c55e;">آنلاین</span>
                </div>
            `).join('');
        }

        function filterUsers() {
            selectedUser = '';
            renderUserList(document.getElementById('privateUsername').value);
        }

        function selectUser(username) {
            selectedUser = username;
            document.getElementById('privateUsername').value = username;
            renderUserList(username);
        }

        function getPrivateReceiver() {
            const users = [myUsername, chatTarget].sort();
            return 'PRIVATE:' + users[0] + '|' + users[1];
        }

        async function startPrivateChatFromInput() {
            const errDiv = document.getElementById('privateError');
            errDiv.style.display = 'none';
            let target = selectedUser || document.getElementById('privateUsername').value.trim();
            if (!target) {
                errDiv.innerText = 'لطفاً یک کاربر را انتخاب کنید!';
                errDiv.style.display = 'block';
                return;
            }
            if (target === myUsername) {
                errDiv.innerText = 'نمی‌تونی به خودت پیام بدی!';
                errDiv.style.display = 'block';
                return;
            }
            if (!allUsers.includes(target)) {
                errDiv.innerText = 'کاربر پیدا نشد!';
                errDiv.style.display = 'block';
                return;
            }
            chatType = 'private';
            chatTarget = target;
            document.getElementById('chatModeInfo').classList.add('show');
            document.getElementById('chatWithName').innerText = target;
            document.getElementById('headerSubtitle').innerText = '💬 چت خصوصی';
            closePrivateModal();
            await loadMessages();
        }

        function backToGroup() {
            chatType = 'group';
            chatTarget = '';
            document.getElementById('chatModeInfo').classList.remove('show');
            document.getElementById('headerSubtitle').innerText = '💬 پیام‌ها در این گروه ذخیره می‌شوند';
            document.getElementById('notifBadge').style.display = 'none';
            loadMessages();
        }
