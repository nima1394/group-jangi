<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروه جنگی 🔥</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .app-container { background: #1e293b; width: 100%; max-width: 480px; border-radius: 12px; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; height: 95vh; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #475569; }
        .header { padding: 12px; background: #0f172a; border-bottom: 1px solid #334155; }
        .user-info { font-size: 12px; color: #38bdf8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .group-title { text-align: center; padding: 8px; background: #1e293b; border-radius: 8px; margin-bottom: 8px; border: 1px solid #facc15; }
        .group-title h2 { color: #facc15; font-size: 18px; }
        .group-title span { color: #94a3b8; font-size: 12px; }
        .top-btns { display: flex; gap: 6px; align-items: center; }
        .top-btn { background: #38bdf8; color: #0f172a; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .top-btn:hover { opacity: 0.9; }
        .private-btn { background: #8b5cf6; color: #fff; }
        .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0b1120; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .msg.sent { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-left-radius: 0; }
        .msg.received { align-self: flex-start; background: #334155; color: #e2e8f0; border-bottom-right-radius: 0; }
        .msg.private-sent { align-self: flex-end; background: #8b5cf6; color: #fff; border-bottom-left-radius: 0; }
        .msg.private-received { align-self: flex-start; background: #6d28d9; color: #fff; border-bottom-right-radius: 0; }
        .msg-sender { font-size: 10px; color: #facc15; margin-bottom: 3px; font-weight: bold; }
        .msg-time { font-size: 9px; opacity: 0.7; margin-top: 4px; text-align: left; }
        .msg-system { align-self: center; background: #475569; color: #94a3b8; font-size: 11px; padding: 4px 12px; border-radius: 20px; max-width: 90%; text-align: center; }
        .input-box { padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 13px; outline: none; }
        button { padding: 8px 12px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 12px; }
        button:hover { opacity: 0.9; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 8px; }
        .chat-mode-info { background: #8b5cf6; color: #fff; padding: 6px 12px; font-size: 11px; text-align: center; display: none; }
        .chat-mode-info.show { display: block; }
        .notif-badge { background: #ef4444; color: #fff; border-radius: 50%; padding: 1px 6px; font-size: 10px; margin-right: 5px; font-weight: bold; }
        .user-list { max-height: 200px; overflow-y: auto; margin: 10px 0; text-align: right; }
        .user-item { background: #0f172a; padding: 10px 15px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .user-item:hover { background: #334155; border-color: #8b5cf6; }
        .user-item.selected { background: #8b5cf6; border-color: #8b5cf6; }
        .user-item .name { color: #fff; font-weight: bold; }
        .online-dot { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-left: 5px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="loginModal" class="modal" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; color: #facc15;">🔥 ورود به گروه جنگی</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">لطفاً نام خود را وارد کنید:</p>
            <input type="text" id="modalUsername" placeholder="اسم شما...">
            <button onclick="registerUser()" style="width: 100%; margin-top: 10px; background: #facc15; color: #0f172a;">ورود به گروه 🚀</button>
            <div id="loginError" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <div id="privateModal" class="modal" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; color: #8b5cf6;">💬 چت خصوصی</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">یک کاربر را انتخاب کنید:</p>
            <input type="text" id="privateUsername" placeholder="جستجوی کاربر..." oninput="filterUsers()" style="margin-bottom:10px;">
            <div class="user-list" id="userList"></div>
            <button onclick="startPrivateChatFromInput()" style="width: 100%; margin-top: 10px; background: #8b5cf6; color: #fff;">شروع چت 💜</button>
            <button onclick="closePrivateModal()" style="width: 100%; margin-top: 8px; background: #475569; color: #fff;">بستن</button>
            <div id="privateError" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <div class="user-info">
                <span>👤 <b id="currentUserLabel">...</b><span class="online-dot"></span></span>
                <div class="top-btns">
                    <span id="notifBadge" class="notif-badge" style="display:none;">0</span>
                    <button class="top-btn private-btn" onclick="openPrivateModal()">💬 خصوصی</button>
                </div>
            </div>
            <div class="group-title">
                <h2>🔥 گروه جنگی</h2>
                <span id="headerSubtitle">💬 پیام‌ها در این گروه ذخیره می‌شوند</span>
            </div>
        </div>
        <div class="chat-mode-info" id="chatModeInfo">
            💬 چت خصوصی با: <b id="chatWithName"></b>
            <button onclick="backToGroup()" style="background:#fff;color:#8b5cf6;margin-right:10px;padding:2px 8px;font-size:11px;border:none;border-radius:4px;cursor:pointer;">بازگشت به گروه</button>
        </div>
        <div class="messages-box" id="messagesBox">
            <div class="msg-system">🔥 به گروه جنگی خوش آمدید!</div>
        </div>
        <div class="input-box">
            <input type="text" id="msgInput" placeholder="پیام خود را بنویسید..." disabled>
            <button onclick="sendMessage()" id="sendBtn" disabled>ارسال 🚀</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jimvkiprcbpqruvhyfrm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_00YkZ5PxbALEn4O09XKgSw_KFQiSWE0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const GROUP_NAME = "گروه جنگی";
        let myUsername = localStorage.getItem('chat_username');
        let fetchInterval = null;
        let chatType = 'group';
        let chatTarget = '';
        let lastMsgIds = new Set();
        let allUsers = [];
        let selectedUser = '';

        window.onload = async () => {
            if (!myUsername) {
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                document.getElementById('currentUserLabel').innerText = myUsername;
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                await loadMessages();
                await loadAllUsers();
                startAutoRefresh();
            }
        };

        async function registerUser() {
            const nameInput = document.getElementById('modalUsername').value.trim();
            const errDiv = document.getElementById('loginError');
            errDiv.style.display = 'none';
            if (!nameInput) {
                errDiv.innerText = 'لطفاً نام را وارد کنید!';
                errDiv.style.display = 'block';
                return;
            }
            try {
                const { data: existing } = await supabaseClient
                    .from('users').select('id').eq('username', nameInput).limit(1);
                if (!existing || existing.length === 0) {
                    await supabaseClient.from('users').insert([{ username: nameInput }]);
                }
                localStorage.setItem('chat_username', nameInput);
                myUsername = nameInput;
                document.getElementById('currentUserLabel').innerText = myUsername;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                await sendWelcomeMessage();
                await loadMessages();
                await loadAllUsers();
                startAutoRefresh();
            } catch(e) { 
                errDiv.innerText = 'خطا: ' + e.message;
                errDiv.style.display = 'block';
            }
        }

        async function sendWelcomeMessage() {
            const welcomeText = '👋 ' + myUsername + ' به گروه پیوست!';
            const compressedText = LZString.compressToUTF16(welcomeText);
            await supabaseClient.from('messages').insert([{
                sender: 'system',
                receiver: 'GROUP:' + GROUP_NAME,
                content: compressedText
            }]);
        }

        async function loadAllUsers() {
            try {
                const { data } = await supabaseClient.from('users').select('username');
                if (data) {
                    allUsers = data.map(u => u.username).filter(u => u !== myUsername);
                }
            } catch(e) { console.error(e); }
        }

        function openPrivateModal() {
            document.getElementById('privateModal').style.display = 'flex';
            document.getElementById('privateUsername').value = '';
            document.getElementById('privateError').style.display = 'none';
            selectedUser = '';
            renderUserList('');
        }

        function closePrivateModal() {
            document.getElementById('privateModal').style.display = 'none';
        }

        function renderUserList(filter) {
            const list = document.getElementById('userList');
            const filtered = allUsers.filter(u => u.toLowerCase().includes(filter.toLowerCase()));
            if (filtered.length === 0) {
                list.innerHTML = '<div style="color:#64748b;padding:10px;font-size:12px;text-align:center;">کاربری یافت نشد</div>';
                return;
            }
            list.innerHTML = filtered.map(u => `
                <div class="user-item ${selectedUser === u ? 'selected' : ''}" onclick="selectUser('${u}')">
                    <span class="name">👤 ${u}</span>
                    <span style="font-size:10px;color:#22c55e;">آنلاین</span>
                </div>
            `).join('');
        }

        function filterUsers() {
            selectedUser = '';
            renderUserList(document.getElementById('privateUsername').value);
        }

        function selectUser(username) {
            selectedUser = username;
            document.getElementById('privateUsername').value = username;
            renderUserList(username);
        }

        async function startPrivateChatFromInput() {
            const errDiv = document.getElementById('privateError');
            errDiv.style.display = 'none';
            let target = selectedUser || document.getElementById('privateUsername').value.trim();
            if (!target) {
                errDiv.innerText = 'لطفاً یک کاربر را انتخاب کنید!';
                errDiv.style.display = 'block';
                return;
            }
            if (target === myUsername) {
                errDiv.innerText = 'نمی‌تونی به خودت پیام بدی!';
                errDiv.style.display = 'block';
                return;
            }
            if (!allUsers.includes(target)) {
                errDiv.innerText = 'کاربر با این نام پیدا نشد!';
                errDiv.style.display = 'block';
                return;
            }
            chatType = 'private';
            chatTarget = target;
            document.getElementById('chatModeInfo').classList.add('show');
            document.getElementById('chatWithName').innerText = target;
            document.getElementById('headerSubtitle').innerText = '💬 چت خصوصی';
            closePrivateModal();
            await loadMessages();
        }

        function backToGroup() {
            chatType = 'group';
            chatTarget = '';
            document.getElementById('chatModeInfo').classList.remove('show');
            document.getElementById('headerSubtitle').innerText = '💬 پیام‌ها در این گروه ذخیره می‌شوند';
            document.getElementById('notifBadge').style.display = 'none';
            loadMessages();
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const rawText = input.value.trim();
            if (!rawText) return;
            const compressedText = LZString.compressToUTF16(rawText);
            input.value = '';
            let receiver;
            if (chatType === 'group') {
                receiver = 'GROUP:' + GROUP_NAME;
            } else {
                const users = [myUsername, chatTarget].sort();
                receiver = 'PRIVATE:' + users[0] + '|' + users[1];
            }
            const { error } = await supabaseClient.from('messages').insert([{
                sender: myUsername,
                receiver: receiver,
                content: compressedText
            }]);
            if (error) alert('خطا در ارسال: ' + error.message);
            else await loadMessages();
        }

        async function loadMessages() {
            let query = supabaseClient.from('messages').select('*');
            if (chatType === 'group') {
                query = query.eq('receiver', 'GROUP:' + GROUP_NAME);
            } else {
                const users = [myUsername, chatTarget].sort();
                query = query.eq('receiver', 'PRIVATE:' + users[0] + '|' + users[1]);
            }
            const { data, error } = await query.order('created_at', { ascending: true });
            if (error) return;
            const box = document.getElementById('messagesBox');
            const newIds = new Set((data || []).map(m => m.id));
            let hasNew = false;
            newIds.forEach(id => { if (!lastMsgIds.has(id)) hasNew = true; });
            box.innerHTML = '';
            if (!data || data.length === 0) {
                box.innerHTML = '<div class="msg-system">' + (chatType === 'group' ? '🔥 گروه جنگی - هنوز پیامی ارسال نشده است' : '💬 چت خصوصی - هنوز پیامی رد و بدل نشده') + '</div>';
                lastMsgIds = newIds;
                return;
            }
            data.forEach(msg => {
                let text = LZString.decompressFromUTF16(msg.content);
                if (!text) text = msg.content;
                const isMe = msg.sender === myUsername;
                const isSystem = msg.sender === 'system';
                if (isSystem) {
                    const div = document.createElement('div');
                    div.className = 'msg-system';
                    div.innerText = text;
                    box.appendChild(div);
                    return;
                }
                const div = document.createElement('div');
                let cls = isMe ? 'sent' : 'received';
                if (chatType === 'private') cls = isMe ? 'private-sent' : 'private-received';
                div.className = 'msg ' + cls;
                const time = new Date(msg.created_at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                let senderHtml = !isMe ? '<div class="msg-sender">' + msg.sender + '</div>' : '';
                div.innerHTML = senderHtml + '<div>' + text + '</div><div class="msg-time">' + time + '</div>';
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
            lastMsgIds = newIds;
            if (hasNew && data.length > 0) {
                const lastMsg = data[data.length - 1];
                if (lastMsg.sender !== myUsername && lastMsg.sender !== 'system') {
                    playNotificationSound();
                }
            }
        }

        async function checkPrivateNotifications() {
            if (!myUsername || chatType === 'private') {
                document.getElementById('notifBadge').style.display = 'none';
                return;
            }
            try {
                const { data } = await supabaseClient
                    .from('messages').select('*')
                    .like('receiver', 'PRIVATE:%')
                    .neq('sender', myUsername)
                    .order('created_at', { ascending: false })
                    .limit(50);
                if (!data) return;
                const myPrivate = data.filter(msg => {
                    const parts = msg.receiver.replace('PRIVATE:', '').split('|');
                    return parts.includes(myUsername);
                });
                if (myPrivate.length > 0) {
                    const badge = document.getElementById('notifBadge');
                    badge.style.display = 'inline-block';
                    badge.innerText = myPrivate.length;
                }
            } catch(e) { console.error(e); }
        }

        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.value = 0.1;
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function startAutoRefresh() {
            if (fetchInterval) clearInterval(fetchInterval);
            fetchInterval = setInterval(async () => {
                await loadMessages();
                await loadAllUsers();
                if (chatType === 'group') await checkPrivateNotifications();
            }, 1000);
        }

        document.getElementById('msgInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
