<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست</title>
    <style>
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Tahoma; margin: 0; padding: 20px; }
        .container { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #facc15; margin-bottom: 20px; }
        .screen { padding: 20px; background: #0f172a; border-radius: 12px; margin-bottom: 15px; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn1 { background: #facc15; color: #0f172a; }
        .btn2 { background: #8b5cf6; color: #fff; }
        .back { background: #64748b; color: #fff; }
    </style>
</head>
<body>
    <!-- صفحه اصلی -->
    <div id="homeScreen" class="container">
        <h1>🔥 خوش آمدی</h1>
        <button class="btn1" onclick="showScreen('gj')">🔥 گروه جنگی</button>
        <button class="btn2" onclick="showScreen('msg')">💬 پیام‌رسان</button>
    </div>

    <!-- گروه جنگی -->
    <div id="gjScreen" class="container" style="display: none;">
        <h1>🔥 گروه جنگی</h1>
        <div class="screen">اینجا صفحه گروه جنگیه!</div>
        <button class="back" onclick="showScreen('home')">← بازگشت</button>
    </div>

    <!-- پیام‌رسان -->
    <div id="msgScreen" class="container" style="display: none;">
        <h1>💬 پیام‌رسان</h1>
        <div class="screen">اینجا صفحه پیام‌رسانه!</div>
        <button class="back" onclick="showScreen('home')">← بازگشت</button>
    </div>

    <script>
        function showScreen(name) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gjScreen').style.display = 'none';
            document.getElementById('msgScreen').style.display = 'none';
            
            if (name === 'home') document.getElementById('homeScreen').style.display = 'block';
            else if (name === 'gj') document.getElementById('gjScreen').style.display = 'block';
            else if (name === 'msg') document.getElementById('msgScreen').style.display = 'block';
        }
    </script>
</body>
</html>
